[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-scout-cagliari"
version = "0.1.0"
description = "Ricerca di voli andata/ritorno da Cagliari Elmas (CAG) con controllo del budget API"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "rich==14.1.0",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[project.scripts]
flight-scout = "flight_scout.cli:main"

[tool.setuptools.packages.find]
include = ["flight_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
